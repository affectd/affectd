# Reproducible, signed release builds. Same inputs produce the same binaries:
# -trimpath removes local paths and mod_timestamp fixes file times to the commit.
version: 2

project_name: affectd

before:
  hooks:
    - go mod verify

builds:
  - id: affectd
    main: ./cmd/affectd
    binary: affectd
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Fix every file's time inside the archive to the commit date, so the
    # archives, not just the binaries, are identical across builds.
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One SBOM per archive, generated by Syft.
sboms:
  - artifacts: archive

# Keyless Sigstore signature over the checksums file, which covers every asset.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]

release:
  draft: true
  prerelease: auto

changelog:
  use: github
  sort: asc
