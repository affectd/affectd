# Keeps Go modules and pinned GitHub Actions current. Dependabot updates pinned
# commit SHAs itself. The cooldown waits 14 days after a release before
# proposing it, because compromised releases are usually caught within days.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      go-modules:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ["*"]
