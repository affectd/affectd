# Signed, reproducible releases. Runs when a maintainer pushes a v* tag, and
# waits in the protected "release" environment for the other maintainer's
# approval. The network is locked to the hosts a release needs.
name: release
on:
  push:
    tags: ["v*"]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write     # create the draft release and upload assets
      id-token: write     # keyless Sigstore signing and provenance
      attestations: write # SLSA build provenance
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443 github.com:443 uploads.github.com:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 proxy.golang.org:443 sum.golang.org:443 storage.googleapis.com:443 fulcio.sigstore.dev:443 rekor.sigstore.dev:443 tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # no shared cache in a release build
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      # GoReleaser creates a draft so every asset is attached before the
      # release is published and, with immutable releases, locked.
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  homebrew-tap:
    name: Update the Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443 github.com:443 codeload.github.com:443
      # Short-lived token from a GitHub App limited to the tap repository,
      # instead of a long-lived personal access token.
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write      # push the update branch
          permission-pull-requests: write # open the pull request
      - name: Open a pull request that updates the formula
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          gh repo clone "${GITHUB_REPOSITORY_OWNER}/homebrew-tap" tap -- --depth 1
          cd tap
          git switch -c "affectd-${TAG}"
          sed -i -E "s#^  url \".*\"#  url \"${url}\"#; s#^  sha256 \".*\"#  sha256 \"${sha}\"#" Formula/affectd.rb
          git -c user.name="affectd-release" -c user.email="release@users.noreply.github.com" commit -s -am "affectd ${TAG}"
          git push origin "affectd-${TAG}"
          gh pr create --title "affectd ${TAG}" --body "Automated formula update for ${TAG}."
