# Verifies every published release the way a user would: checksums, the
# Sigstore signature tied to this repository's release workflow, and SLSA
# provenance. A release that fails here is announced as broken immediately.
name: verify-release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify the release like a user
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the repository
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify checksums, signature and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist
          cd dist
          sha256sum --check --ignore-missing checksums.txt
          cosign verify-blob checksums.txt \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          for f in *.tar.gz *.zip; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"
          done
