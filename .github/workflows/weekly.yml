# Slow checks that don't need to block every pull request.
name: weekly
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the repository
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make mutation

  fuzz-long:
    name: Fuzz (long)
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the repository
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make fuzz FUZZTIME=10m

  osv-scanner:
    name: OSV-Scanner
    permissions:
      actions: read # read workflow run metadata
      contents: read # read the repository
      security-events: write # upload results to code scanning
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
