# Template for .github/workflows/build.yml in the affectd/data repository.
# Builds the signed threat-data file hourly at 17 minutes past. Devices verify
# the Sigstore signature against this workflow's identity on main, so only
# this reviewed workflow can produce data they accept. The network is locked
# to the official data sources; adjust the list to the builder's real sources.
name: build
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  build:
    name: Build, sign and publish the data file
    runs-on: ubuntu-latest
    permissions:
      contents: write     # publish the data release
      id-token: write     # keyless Sigstore signing
      attestations: write # build provenance for the data file
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443 github.com:443 uploads.github.com:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 proxy.golang.org:443 sum.golang.org:443 storage.googleapis.com:443 raw.githubusercontent.com:443 epss.empiricalsecurity.com:443 fulcio.sigstore.dev:443 rekor.sigstore.dev:443 tuf-repo-cdn.sigstore.dev:443
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build the data file
        run: go run ./cmd/build-data --out dist/affectd-data.tar.zst
      - name: Sign the data file
        run: cosign sign-blob --yes --bundle dist/affectd-data.tar.zst.sigstore.json dist/affectd-data.tar.zst
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/affectd-data.tar.zst
      - name: Publish an immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="data-$(date -u +%Y%m%d%H)"
          gh release create "$tag" dist/affectd-data.tar.zst dist/affectd-data.tar.zst.sigstore.json \
            --repo "$GITHUB_REPOSITORY" --title "$tag" --notes "Hourly threat data build." --latest
